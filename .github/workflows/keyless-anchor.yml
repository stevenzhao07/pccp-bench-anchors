name: keyless-anchor

# 用 GitHub Actions 自带的 OIDC 身份（issuer = token.actions.githubusercontent.com）
# 对跑分产物做 keyless 签名并写入公共 Rekor。
#
# 两种取件方式（二选一）：
#   artifact_path —— 仓库内已有文件（优先）
#   artifact_url  —— 外部直链，下载后核对 sha256

on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: "仓库内相对路径（留空则改用 artifact_url）"
        required: false
        default: "receipts/receipt_demo5.canonical.json"
      artifact_url:
        description: "外部产物直链（artifact_path 为空时使用）"
        required: false
        default: "https://zenodo.org/records/24550267/files/pccp-bench_zenodo_v0.1.0.zip"
      expect_sha256:
        description: "期望 sha256（留空则只打印实测值）"
        required: false
        default: "b19fd9d6dc473fee5f069449ef71541f28be9d455074336bb85db4db7fd349bd"

permissions:
  contents: read
  id-token: write   # 必须，否则拿不到 OIDC token

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取件并核对哈希
        run: |
          set -euo pipefail
          PATH_IN="${{ inputs.artifact_path }}"
          if [ -n "$PATH_IN" ] && [ -f "$PATH_IN" ]; then
            cp "$PATH_IN" artifact.bin
            echo "source=repo:$PATH_IN"
          else
            URL="${{ inputs.artifact_url }}"
            curl -fsSL --retry 3 -o artifact.bin "$URL"
            echo "source=url:$URL"
          fi
          ls -l artifact.bin
          ACTUAL=$(sha256sum artifact.bin | awk '{print $1}')
          echo "sha256=$ACTUAL"
          EXP="${{ inputs.expect_sha256 }}"
          if [ -n "$EXP" ] && [ "$ACTUAL" != "$EXP" ]; then
            echo "::error::sha256 不一致：期望 $EXP，实测 $ACTUAL"; exit 1
          fi

      - name: keyless 签名（Fulcio + Rekor）
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: ./artifact.bin
          release-signing-artifacts: false

      - name: 打印 bundle 关键字段
        run: |
          python - <<'PY'
          import json,glob
          for p in glob.glob("*.sigstore.json"):
              d=json.load(open(p))
              v=d.get("verificationMaterial",{})
              print("bundle:",p)
              print(" tlog entries:",len(v.get("tlogEntries",[])))
              for e in v.get("tlogEntries",[]):
                  print("  logIndex",e.get("logIndex"),"logId",(e.get("logId") or {}).get("keyId","")[:16])
                  print("  integratedTime",e.get("integratedTime"))
              sig=(d.get("messageSignature") or {}).get("messageDigest",{})
              print(" messageDigest",sig.get("algorithm"),sig.get("digest","")[:24],"…")
          PY

      - name: 上传 bundle 与产物哈希
        uses: actions/upload-artifact@v4
        with:
          name: keyless-bundle
          path: |
            *.sigstore.json
            artifact.bin
          retention-days: 90
